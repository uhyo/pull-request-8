<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;
  background:radial-gradient(ellipse at center,#1b1f26 0%,#050505 75%);
  color:#e6e6e6;font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.repo{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:29px;color:#8b929b;letter-spacing:.5px;margin-bottom:12px}
.title{display:flex;align-items:center;gap:24px;font-weight:900;font-size:113px;line-height:1;letter-spacing:2px;color:#ececec}
.num{background:#f2c200;color:#111;border-radius:10px;padding:12px 28px 16px;font-size:100px;letter-spacing:0}
.sub{font-weight:500;font-size:31px;color:#d0d4da;margin-top:38px}
.btns{display:flex;gap:24px;margin-top:52px}
.btn{font-weight:700;font-size:27px;height:72px;box-sizing:border-box;padding:0 36px;border-radius:8px;display:flex;align-items:center;border:2px solid #3d444d;background:#151b23}
.danger{color:#f85149}
.primary{background:#238636;border-color:#2ea043;color:#fff}
</style></head><body>
<div class="repo">acme / admin-console</div>
<div class="title"><span>プルリクエスト</span><span class="num">#8</span></div>
<div class="sub">AI が書いたプルリクエストを、説明文だけでレビューする異変探しゲーム</div>
<div class="btns"><div class="btn danger">変更をリクエスト</div><div class="btn primary">承認</div></div>
</body></html>
